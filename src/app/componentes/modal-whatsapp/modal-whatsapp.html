@if (whatsapp.aberto()) {
  <div
    class="fixed inset-0 z-[100] flex items-end justify-center p-4 sm:items-center sm:p-6"
    role="presentation"
  >
    <button
      type="button"
      class="absolute inset-0 bg-zinc-950/80 backdrop-blur-sm"
      aria-label="Fechar formulário"
      (click)="fechar()"
    ></button>

    <div
      class="relative z-10 w-full max-w-lg overflow-hidden rounded-3xl border border-white/10 bg-zinc-900 shadow-2xl shadow-black/50"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-whatsapp-titulo"
    >
      <div class="border-b border-white/10 bg-gradient-to-br from-emerald-500/10 to-transparent px-6 py-5 sm:px-8">
        <h2 id="modal-whatsapp-titulo" class="text-xl font-bold text-white sm:text-2xl">
          {{ dados.whatsappFormulario.titulo }}
        </h2>
        <p class="mt-2 text-sm text-zinc-400">{{ dados.whatsappFormulario.subtitulo }}</p>
      </div>

      <form class="space-y-6 px-6 py-6 sm:px-8" (ngSubmit)="enviar()">
        <div>
          <label for="whatsapp-nome" class="mb-2 block text-sm font-medium text-zinc-300">
            {{ dados.whatsappFormulario.labelNome }}
          </label>
          <input
            id="whatsapp-nome"
            type="text"
            name="nome"
            class="w-full rounded-xl border border-white/10 bg-zinc-950 px-4 py-3 text-white placeholder:text-zinc-600 focus:border-emerald-500/50 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
            [placeholder]="dados.whatsappFormulario.placeholderNome"
            [(ngModel)]="nome"
          />
        </div>

        <fieldset>
          <legend class="mb-3 text-sm font-medium text-zinc-300">
            {{ dados.whatsappFormulario.labelObjetivo }}
          </legend>
          <div class="grid gap-2 sm:grid-cols-2">
            @for (obj of dados.whatsappFormulario.objetivos; track obj.id) {
              <label
                class="flex cursor-pointer items-center gap-3 rounded-xl border px-4 py-3 transition"
                [class.border-emerald-500/50]="objetivoId === obj.id"
                [class.bg-emerald-500/10]="objetivoId === obj.id"
                [class.border-white/10]="objetivoId !== obj.id"
                [class.bg-zinc-950/60]="objetivoId !== obj.id"
              >
                <input
                  type="radio"
                  name="objetivo"
                  class="h-4 w-4 shrink-0 accent-emerald-500"
                  [value]="obj.id"
                  [(ngModel)]="objetivoId"
                />
                <span class="text-sm font-medium text-zinc-100">{{ obj.rotulo }}</span>
              </label>
            }
          </div>
        </fieldset>

        @if (objetivoId === 'outro') {
          <div>
            <label for="whatsapp-outro" class="mb-2 block text-sm font-medium text-zinc-300">
              {{ dados.whatsappFormulario.labelOutro }}
            </label>
            <input
              id="whatsapp-outro"
              type="text"
              name="outro"
              class="w-full rounded-xl border border-white/10 bg-zinc-950 px-4 py-3 text-white placeholder:text-zinc-600 focus:border-emerald-500/50 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
              [placeholder]="dados.whatsappFormulario.placeholderOutro"
              [(ngModel)]="outroTexto"
            />
          </div>
        }

        @if (erro) {
          <p class="text-sm font-medium text-red-400" role="alert">{{ erro }}</p>
        }

        <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
          <button
            type="button"
            class="rounded-xl border border-white/15 px-5 py-3 text-sm font-semibold text-zinc-300 transition hover:bg-white/5"
            (click)="fechar()"
          >
            {{ dados.whatsappFormulario.botaoCancelar }}
          </button>
          <button
            type="submit"
            class="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-500 px-5 py-3 text-sm font-semibold text-zinc-950 shadow-lg shadow-emerald-500/25 transition hover:bg-emerald-400"
          >
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
              />
            </svg>
            {{ dados.whatsappFormulario.botaoEnviar }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
